name: Linux CI and release artifacts

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Frontend and Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev \
            libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev \
            dbus-x11 libnotify-bin libssl-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev libxdo-dev patchelf pkg-config xdg-utils xvfb
      - run: npm ci
      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage
      - name: Collect AppImage artifact
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          test -n "$(find artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"
      - name: Validate AppImage contents
        run: |
          appimage="$(find artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"
          mkdir appimage-check
          cd appimage-check
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -n "$(find squashfs-root/usr/share/applications -maxdepth 1 -name '*.desktop' -print -quit)"
          test -n "$(find squashfs-root -maxdepth 1 -name '*.png' -print -quit)"
          rm -rf squashfs-root
      - name: Smoke launch AppImage in a disposable desktop session
        run: |
          appimage="$(find artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"
          data_dir="$(mktemp -d)"
          set +e
          xvfb-run -a dbus-run-session -- env XDG_DATA_HOME="$data_dir" \
            timeout --signal=TERM 15s "$GITHUB_WORKSPACE/$appimage" \
            --appimage-extract-and-run >appimage-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat appimage-smoke.log
            echo "AppImage exited before the smoke-test timeout (status $status)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kytyps5-linux-appimage
          path: artifacts/*.AppImage
          if-no-files-found: error
          compression-level: 0

  arch-package:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with current Arch Linux toolchain
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed \
                git nodejs npm rust cargo webkit2gtk-4.1 gtk3 appmenu-gtk-module xdotool \
                libayatana-appindicator librsvg xdg-utils libnotify libsecret \
                pkgconf cmake ninja clang
              useradd --create-home builder
              chown -R builder:builder /workspace
              su - builder -s /bin/bash -c "cd /workspace && ./packaging/arch/test-flags.sh && ./packaging/arch/build-package.sh"
              mkdir -p /workspace/artifacts
              package=$(find /workspace/packaging/arch -maxdepth 1 -name "kytyps5-studio-*.pkg.tar.zst" -print -quit)
              test -n "$package"
              bsdtar -tf "$package" | grep -Fx "usr/bin/kytyps5-studio"
              bsdtar -tf "$package" | grep -Fx "usr/share/applications/kytyps5-studio.desktop"
              bsdtar -tf "$package" | grep -Fx "usr/share/icons/hicolor/512x512/apps/kytyps5-studio.png"
              cp "$package" /workspace/artifacts/
            '
      - uses: actions/upload-artifact@v4
        with:
          name: kytyps5-linux-arch
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Linux release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, appimage, arch-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kytyps5-linux-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
